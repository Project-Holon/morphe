[package]
name = "katalogos"
description = "Builds an eidos mod's release files (mod.bw, mod.json) and checks the katalogos mod index."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "katalogos"
path = "src/main.rs"
required-features = ["net"]

[features]
default = ["net"]
# Downloads the listed mods (check, pending).
net = ["dep:ureq"]

[dependencies]
eidos-mod = { path = "../eidos-mod" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
ureq = { version = "2", optional = true }

[dev-dependencies]
tempfile.workspace = true
