[workspace]
resolver = "2"
members = ["crates/eidos-mod", "crates/nds", "crates/releases"]

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Project-Holon/morphe"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
